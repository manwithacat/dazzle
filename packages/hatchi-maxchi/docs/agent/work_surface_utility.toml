# Work-surface utility ontology (Hyperpart region / display modes).
#
# Purpose: machine-readable answers to "when is this surface the right UX?"
# and a baseline for measuring utility gain when we introduce or switch UX.
#
# Human playbook: docs/agent/pick-a-work-surface.md
# Scanner: dazzle.qa.work_surface_utility / scripts/work_surface_utility.py
#
# Schema (each [[surface]]):
#   id            — stable stem (matches gallery / DSL display where possible)
#   layer         — region | chrome | field
#   job           — one-sentence primary job
#   use_when      — positive fit criteria (any match → candidate)
#   refuse_when   — anti-fit (any match → do not recommend)
#   prefers_over  — weaker alternatives this surface usually beats for its job
#   utility_axes  — measurable axes this surface is meant to improve
#   dsl_hints     — AppSpec / DSL signals that imply this surface
#   measure_proxy — how we proxy "utility improved" in fleet/trials

version = 1
updated = "2026-07-29"

# Axes used in utility_axes / measure_proxy (stable vocabulary).
[axes]
scan_breadth = "How many records can an operator compare without opening detail"
state_progress = "How clearly workflow stage / status is visible and movable"
time_order = "How clearly temporal sequence is preserved"
attention_rank = "How clearly urgency / SLA / priority surfaces"
mutation_cost = "Cost (clicks/risk) to change a field or stage"
density_fit = "Information density matches the job (not sparse, not illegible)"

[[surface]]
id = "kanban"
layer = "region"
job = "Move work through a small set of workflow stages; compare WIP across stages."
use_when = [
  "entity has a closed status/stage enum with 3–7 stages",
  "primary operator job is pull/prioritize work across stages (not pure chronology)",
  "cards need title + 1–3 fields visible without opening detail",
  "cross-stage rearrange is a first-class action (drag or move)",
]
refuse_when = [
  "more than ~8 stages (board becomes unreadable)",
  "primary job is time-ordered history or audit trail",
  "records are mostly terminal/read-only (no stage movement)",
  "dense multi-column comparison is required (use table/list)",
  "single-operator personal triage by urgency only (prefer task_inbox/queue)",
]
prefers_over = ["list", "table", "queue"]
utility_axes = ["state_progress", "scan_breadth", "mutation_cost"]
dsl_hints = [
  "surface.display == kanban",
  "region kind kanban",
  "entity status enum + rearrange/transition policy",
]
measure_proxy = "stage_moves_per_session | wip_balance_skew | time_to_first_stage_change"

[[surface]]
id = "timeline"
layer = "region"
job = "Present dated events in chronological order with attention tone on each event."
use_when = [
  "items are events with a primary timestamp (created/occurred/due history)",
  "order by time is the main mental model (not status columns)",
  "each row is a sparse event (title + optional field), not a multi-field record",
  "attention tone (critical/default) helps scan the stream",
]
refuse_when = [
  "operators must rearrange items into stages (use kanban)",
  "need multi-column filterable table of live inventory",
  "events are pure metrics without narrative (use chart)",
  "personal work queue by urgency without caring about clock order (task_inbox)",
]
prefers_over = ["list", "activity_feed"]
utility_axes = ["time_order", "attention_rank", "scan_breadth"]
dsl_hints = [
  "surface.display == timeline",
  "region kind timeline",
  "entity with occurred_at/created_at as primary sort",
]
measure_proxy = "events_scanned_per_minute | critical_event_hit_rate | time_to_first_open"

[[surface]]
id = "day_timeline"
layer = "region"
job = "Schedule or review work on a single-day time axis (slots / blocks)."
use_when = [
  "items have start/end within a calendar day",
  "primary job is scheduling or conflict detection on a day",
]
refuse_when = [
  "multi-week history stream (use timeline)",
  "status-stage pull system (use kanban)",
]
prefers_over = ["list", "timeline"]
utility_axes = ["time_order", "mutation_cost"]
dsl_hints = ["surface.display == day_timeline", "region kind day_timeline"]
measure_proxy = "schedule_conflicts_seen | slot_fill_ratio"

[[surface]]
id = "task_inbox"
layer = "region"
job = "Personal work queue ranked by urgency/attention; act on the top item fast."
use_when = [
  "items are assigned to the current actor (or team inbox)",
  "urgency / SLA / attention dominates over stage layout",
  "primary action is open/complete next item, not rebalance columns",
]
refuse_when = [
  "multi-stage board is the team ceremony (kanban)",
  "pure chronological audit (timeline)",
  "admin bulk table edits across many fields",
]
prefers_over = ["list", "queue"]
utility_axes = ["attention_rank", "mutation_cost", "scan_breadth"]
dsl_hints = ["surface.display == task_inbox", "region kind task_inbox"]
measure_proxy = "time_to_first_action | top_item_completion_rate"

[[surface]]
id = "queue"
layer = "region"
job = "Shared work queue with filters; pull next eligible item under policy."
use_when = [
  "shared pool of work (not only personal inbox)",
  "filter/sort policy matters more than stage columns",
  "claim/pull semantics",
]
refuse_when = [
  "explicit multi-stage board is the product metaphor (kanban)",
  "time-ordered history (timeline)",
]
prefers_over = ["list"]
utility_axes = ["attention_rank", "scan_breadth", "mutation_cost"]
dsl_hints = ["surface.display == queue", "region kind queue"]
measure_proxy = "pull_to_complete_latency | filter_refinement_count"

[[surface]]
id = "list"
layer = "region"
job = "Tabular or row scan of many records with sort/filter; open detail."
use_when = [
  "many fields per row needed for comparison",
  "admin / inventory / search is the job",
  "no strong stage or time metaphor",
]
refuse_when = [
  "stage movement is the daily ritual (kanban)",
  "event history is the product (timeline)",
]
prefers_over = []
utility_axes = ["scan_breadth", "density_fit"]
dsl_hints = ["surface.mode == list", "display list|table|default"]
measure_proxy = "rows_scanned_to_target | filter_to_open_detail"

[[surface]]
id = "activity_feed"
layer = "region"
job = "Social/system activity stream; awareness more than task execution."
use_when = [
  "items are notifications or activity entries",
  "read/acknowledge more than mutate stage",
]
refuse_when = [
  "operator must complete work items (task_inbox/queue/kanban)",
  "strict date audit with field detail (timeline)",
]
prefers_over = ["list"]
utility_axes = ["attention_rank", "time_order"]
dsl_hints = ["surface.display == activity_feed", "region kind activity_feed"]
measure_proxy = "unread_ack_rate | time_to_triage"

[[surface]]
id = "status_list"
layer = "region"
job = "Compact status rows (health/service) with tone; monitor not rearrange."
use_when = [
  "rows represent services/resources with health status",
  "monitoring / ops glance is primary",
]
refuse_when = [
  "cards move between workflow stages (kanban)",
  "dated event narrative (timeline)",
]
prefers_over = ["list"]
utility_axes = ["attention_rank", "scan_breadth"]
dsl_hints = ["surface.display == status_list", "region kind status_list"]
measure_proxy = "mttd_proxy | critical_row_visibility"

# How improve measures "utility improved" when introducing UX.
[measurement]
method = """
1. Ontology fit: work_surface_utility scan residual (mismatches vs dsl_hints).
   Lower residual after a display/region change = better hyperpart fit.
2. Opportunity scan: dazzle qa hyperpart-opportunities + work-surface kinds.
   Author_action rows closed = utility opportunity realized.
3. Trial friction: category missing|confusion on the same surface URL.
   Delta before/after ship (same trial.toml journey) is the human utility signal.
4. Axis proxies: each surface.measure_proxy is a fleet metric name to instrument
   later; do not invent ad-hoc KPIs outside this vocabulary without extending axes.
"""
success_criteria = [
  "work_surface residual decreases or stays 0 after intentional display change",
  "no new refuse_when violations introduced on example apps",
  "trial friction for that journey does not increase severity",
]
