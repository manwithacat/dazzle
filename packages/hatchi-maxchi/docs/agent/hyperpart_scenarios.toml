# Hyperpart scenario catalogue — proactive usage identification for agents.
#
# Purpose: given domain + surface signals, recommend a hyperpart and the
# *authoring class* that should mount it. Complements:
#   - pick-a-surface.md / pick-a-work-surface.md (human pick matrices)
#   - work_surface_utility.toml (region fit / refuse)
#   - dazzle.qa.hyperpart_opportunity (static scanner)
#
# Doctrine: docs/superpowers/specs/2026-08-07-hyperpart-emitter-scenario-cognition-design.md
#
# Schema ([[scenario]]):
#   id              — stable slug
#   hyperpart       — HM part id
#   authoring       — default_emit | display:<mode> | widget:<name> | type | chrome | planned:<note>
#   layer           — cell | region | field | chrome
#   job             — one sentence
#   use_when        — positive fit criteria (heuristic strings for agents + scanners)
#   refuse_when     — anti-fit
#   status_if_fit   — emit_covered | author_action | matrix_miss | planned_emitter
#   ownership       — framework | product
#   severity        — low | medium | high
#   residual_lane   — framework-ux | example-apps | none
#   example_homes   — optional anchors
#   scanner         — python scanner id that implements this row (or "catalogue_only")

version = 1
updated = "2026-08-09"

# ── Default emit (framework; no DSL) ─────────────────────────────────

[[scenario]]
id = "person_ref_cell"
hyperpart = "avatar"
authoring = "default_emit"
layer = "cell"
job = "Show who a person-ref field refers to as an Avatar chip, not raw id/prose."
use_when = [
  "field is ref/belongs_to to a person-like entity (User, Person, Contact, …)",
  "surface is list/detail (not create/edit form field)",
]
refuse_when = [
  "host is metrics_tile (person refused)",
  "column opts out with avatar:false",
]
status_if_fit = "emit_covered"
ownership = "framework"
severity = "low"
residual_lane = "none"
example_homes = ["support_tickets.Ticket.assigned_to"]
scanner = "person_ref"

