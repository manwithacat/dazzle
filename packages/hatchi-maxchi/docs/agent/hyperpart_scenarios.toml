[[scenario]]
id = "boolean_settings_switch"
hyperpart = "switch"
authoring = "widget=switch"
layer = "field"
job = "Boolean settings / preferences use Switch hyperpart, not an anonymous checkbox."
use_when = [
  "boolean field on settings, preferences, or mute/enable surface",
  "immediate on/off semantics (single flag)",
]
refuse_when = [
  "multi-flag checkbox group (prefer controls)",
  "toolbar filter chip (host-local)",
  "row bulk-select checkbox",
]
# Emitter shipped 2026-08-07 (SwitchField). Scanner reports emit_covered when
# widget=switch is present; author_action when boolean settings-like field lacks it.
