[[scenario]]
id = "media_url_thumb_frame"
hyperpart = "aspect-ratio"
authoring = "default_emit"
layer = "cell"
job = "Logo/preview/photo URL cells mount a dual-lock aspect-ratio frame, not a bare fixed-size img."
use_when = [
  "field is image-typed URL (logo_url, preview_url, photo_url, …)",
