# ── Authoring opt-in (product DSL) ───────────────────────────────────

[[scenario]]
id = "shared_urgency_pool"
hyperpart = "queue"
authoring = "display:queue"
layer = "region"
job = "Shared work pool with claim/filter — not a plain list."
use_when = [
  "region name/title matches work-pool heuristics (queue, backlog, overdue, inbox, …)",
  "entity is claimable operational work",
]
refuse_when = [
  "display already in {queue, kanban, task_inbox}",
  "region is pure metrics or chart",
]
status_if_fit = "author_action"
ownership = "product"
severity = "medium"
residual_lane = "example-apps"
example_homes = ["support_tickets ticket_queue"]
scanner = "work_queue"

# ── Planned emitters (gallery exists; no Dazzle path yet) ────────────
# residual_lane=framework-ux: do NOT thrash example-apps until emitter ships.

[[scenario]]
id = "boolean_settings_switch"
hyperpart = "switch"
authoring = "widget=switch"
layer = "field"
job = "Boolean settings / preferences use Switch hyperpart, not an anonymous checkbox."
use_when = [
  "boolean field on settings, preferences, or mute/enable surface",
  "immediate on/off semantics (single flag)",
]
refuse_when = [
  "multi-flag checkbox group (prefer controls)",
  "toolbar filter chip (host-local)",
  "row bulk-select checkbox",
]
# Emitter shipped 2026-08-07 (SwitchField). Scanner reports emit_covered when
# widget=switch is present; author_action when boolean settings-like field lacks it.
status_if_fit = "author_action"
ownership = "product"
severity = "medium"
residual_lane = "example-apps"
example_homes = ["simple_task.user_edit.is_active"]
scanner = "boolean_switch"

[[scenario]]
