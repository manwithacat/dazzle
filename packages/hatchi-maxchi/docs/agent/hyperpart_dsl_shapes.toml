# Hyperpart → rational DSL authoring shape (agent-facing).
#
# Goal: every HM hyperpart has a documented shape agents can use when
# modelling a business domain — live path, planned emitter, or explicit
# chrome/refuse (no freeform invent).
#
# Doctrine: docs/superpowers/specs/2026-08-07-hyperpart-emitter-scenario-cognition-design.md
# Fleet: tests/unit/test_hyperpart_fleet_coverage.py SIGNALS
# Scenarios: packages/hatchi-maxchi/docs/agent/hyperpart_scenarios.toml
#
# Schema ([[part]]):
#   id            — hyperpart id
#   class         — always|default_emit|display|widget|type|mode|peek|chrome|compose|layout|structural|display_or_form
#   layer         — cell|field|region|surface|form|chrome|shell|layout|media|docs|affordance
#   dsl           — authoring string or prose agents write
#   status        — live|planned|chrome_only|refuse
#   job           — one sentence
#   agent_surface — pick-a-surface | pick-a-work-surface | default | shell | none

version = 1
updated = "2026-08-08"

