# Story walk ST-004 — Employee reviews own career timeline hub
# Maps: stems/story-driven-jobs.md, dsl/stories.dsl ST-004 then:
# home_workspace career_desk (renamed from person_detail @1918 so surface
# person_detail is the Person hub; employee default_workspace matches).

persona: employee
home_workspace: career_desk

scenes:
  - id: land_st_004
    story: ST-004
    entry: /app/workspaces/career_desk
    actions:
      - type: navigate
      - type: assert_not_login
      - type: assert_http_ok
      - type: assert_any_text
        texts:
          - Career
          - Employment
          - Salary
          - Person
          - History
    expects: "Authenticated employee sees own career timeline hub cues"
