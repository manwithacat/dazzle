# Qualitative trial — hr_records agent acceptance (stories ST-001..ST-005).
# Consumed by: dazzle qa trial --app hr_records --fresh-db --llm-driver grok-cli

[[scenario]]
name = "hr_admin_directory"
login_persona = "hr_admin"
time_budget_seconds = 900
max_steps = 50
token_budget = 1200000
# Land on Staff Directory so the panel spends budget on person-open + status
# mix, not nav tourism (prior budget_exceeded at step 1 was token thrash).
starting_url = "/app/workspaces/staff_directory"

user_identity = """
You are Ana, HR admin for a 40-person company. You need a staff directory
and honest department views — not a fake org-chart tree if the product is lists.
You are logged in as the hr_admin account for a two-week pilot decision.
"""

business_context = """
You onboard people, look up contacts, and review compensation with finance.
Empty directories fail a pilot immediately. You care about: (1) seeing people
without hunting, (2) opening a person hub that shows employment context and
assignment status (active / on leave / terminated), (3) finding departments/roles
without warehouse admin chrome, (4) a clear path to add someone, (5) compensation
desk people as a scannable pull queue not a card gallery. If those fail, you keep
the spreadsheet.
"""

tasks = [
    "You are on Staff Directory. Are people listed with useful names (not empty)?",
    "On the metrics strip, is assignment status mix visible (active / on leave / terminated counts)?",
    "Open a person row from Current Staff or Media Shelf. Does the URL go to /app/person/{id} (person hub) rather than a company-wide timeline workspace?",
    "On the person hub: employment history with status, salary, reporting — career hub or flat field dump? Is End date free of SQL NULL jargon?",
    "Open Compensation Review. Are people a pull queue toward person hubs?",
    "Find how you would add a person (CTA language) without becoming a warehouse admin.",
    "Decide whether this is a credible HR skeleton for a two-week pilot.",
]

adoption_criteria = [
    "Staff directory shows real person rows when seeded (not empty pilot-breaker)",
    "Employment list triple-opens assignment hub, Person career hub, and Role catalogue; reporting lines triple-open link hub, report Person, and manager Person; salary dual-opens band plus Person; person open is a usable hub",
    "Role list dual-opens Role hub plus Department unit; department list dual-opens unit hub plus parent",
    "Person hub related employment/compensation/reporting regions are pull queues, not warehouse tables",
    "Staff Directory department/role context and Compensation role catalogue/headcount are pull queues toward hubs",
    "Assignment status (active / on leave / terminated) is visible on employment path",
    "Compensation people region is a scannable pull queue, not a decorative grid",
    "Primary create / add-person CTA uses human language and is discoverable",
    "Would run a two-week pilot as-is or with minor fixes",
]

stop_when = """
Stop when you can score the adoption criteria and form a pilot decision
(yes / conditional / no). Prefer depth on the criteria over feature tourism.
Call submit_verdict with recommend=yes|no|conditional|unclear, criteria_scores
for each criterion (pass|partial|fail|untested), and a clear
pilot_blockers_summary if any — from Ana's perspective.
"""
