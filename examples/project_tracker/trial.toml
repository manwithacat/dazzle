# Qualitative trial — project_tracker showcase harness.

[[scenario]]
name = "manager_board"
login_persona = "manager"
time_budget_seconds = 450
max_steps = 50

user_identity = """
You are Ken, engineering manager running a single active project board.
You want to see work across columns and assign unowned tasks.
"""

business_context = """
One product project, ~15 tasks across backlog/todo/in progress/review.
Empty boards kill trust in a demo.
"""

tasks = [
    "Land on Project Board. Are kanban columns populated?",
    "Can you see task titles that sound like real work?",
    "Find unassigned or blocked work if any.",
    "Decide if this is a credible project tracker skeleton for a pilot.",
]

adoption_criteria = [
    "Board shows work in more than one column",
    "Task titles are story-grade, not empty placeholders",
    "Would keep watching a sales demo of this board",
]

stop_when = """
Stop when adoption_criteria can be scored. Call submit_verdict.
"""

[[scenario]]
name = "member_teammate_hub"
login_persona = "member"
time_budget_seconds = 480
max_steps = 50
# Story ST-005 — assignee hop lands Team Member Overview (cycle 1347–1348).

user_identity = """
You are Sam, an IC on the engineering team. You live in My Tasks and the
project board. When a card shows Ken as assignee, you hop their name to
see what else they own before you ping them.
"""

business_context = """
Two active projects, a populated board, and real teammate hubs (not 404s).
A pilot dies if assignee names are dead ends or People shows an empty roster
while the company has three named principals.
"""

tasks = [
    "Land on My Tasks. Open one item — prefer task hub (status, ownership, discussion); confirm dual hop also offers parent project context.",
    "On that task hub, is Discussion a scannable queue (recent comments body-first) rather than a warehouse table?",
    "From the board or My Tasks, open a teammate hub via an assignee name (or Team Member list).",
    "Does the hub show identity, role strip, assigned work, and owned projects?",
    "Decide if My Tasks → task hub → discussion + teammate hops are credible for a two-week pilot.",
]

adoption_criteria = [
    "My Tasks / task list dual-opens Task hub and Project hub (hub first, project second)",
    "Task hub discussion is readable as a pull queue (not a dead warehouse table)",
    "Assignee hop lands a Team Member Overview without 404",
    "Hub shows assigned work and/or owned projects for that person",
    "Would trust My Tasks + teammate context in a two-week pilot as-is or with minor fixes",
]

stop_when = """
Stop when adoption_criteria can be scored. Call submit_verdict.
"""
