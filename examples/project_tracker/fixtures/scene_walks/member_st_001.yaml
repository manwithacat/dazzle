# Story walk ST-001 — Member browses projects and opens a project hub
# Maps: stems/story-driven-jobs.md, dsl/stories.dsl ST-001 then:
#   - Member sees the project list
#   - Row open hops to Project detail with tasks and milestones
# Deepened cycle 1345: land job home → open seed project detail hub.

persona: member
home_workspace: my_tasks

scenes:
  - id: land_st_001
    story: ST-001
    entry: /app/workspaces/my_tasks
    actions:
      - type: navigate
      - type: assert_not_login
      - type: assert_http_ok
      - type: assert_any_text
        texts:
          - Project
          - Task
          - Milestone
          - Board
          - Assigned
    expects: "Authenticated member sees project/task home cues before hub open"
  - id: open_project_hub
    story: ST-001
    entry: /app/project/6a000000-0000-4000-8000-000000000001
    actions:
      - type: navigate
      - type: assert_not_login
      - type: assert_http_ok
      - type: assert_any_text
        texts:
          - Website relaunch
          - Task
          - Milestone
          - Project
          - Tasks
          - Milestones
    expects: "Project detail hub shows seed Website relaunch with task and milestone pull queues"
