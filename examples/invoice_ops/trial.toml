# Qualitative trial — invoice_ops (showcase requires trial.toml / trial_verdict bar).
# Author from job stories ST-001…; run via agent_acceptance_panel dig.

[[scenario]]
name = "approver_desk"
login_persona = "approver"
time_budget_seconds = 500
max_steps = 35

user_identity = """
You are Mira, finance controller at a mid-size professional services firm.
You approve supplier invoices before payment. You are trialling this AP desk
for a two-week pilot with your AP clerk.
"""

business_context = """
Roughly 40 invoices per week. You care that awaiting-approval work is visible
with amount and urgency, that you can open a hub before approve/reject, and that
both the invoice hub related line items / payment attempts and the Line Items
desk use scannable pull queues — not warehouse tables of orphan rows.
"""

tasks = [
    "Land on Approval Desk. Are awaiting / approved / rejected counts obvious?",
    "Skim the awaiting-approval queue. Can you see invoice numbers and amounts without a spreadsheet?",
    "Open one submitted invoice hub. Is status, supplier, amount, and line-item queue legible?",
    "On the invoice hub, are Line items and Payment attempts pull queues (not dense tables)?",
    "If you visit Line Items / Payment Attempts, triple-open line/attempt hubs with Invoice and Tenant context?",
    "On invoice queues, can you dual-open Invoice hub plus Supplier vendor context?",
    "Decide whether you would pilot this desk with your AP clerk.",
]

phases = [
    "Orient on Approval Desk",
    "Queue density and amount visibility",
    "Hub before decision",
    "Hub related queues (lines + payments)",
    "Line composition path",
    "Pilot verdict",
]

adoption_criteria = [
    "Awaiting work is visible without hunting entity lists",
    "Invoice amount is visible on the desk or hub",
    "Approve/reject path is discoverable from the desk",
    "Invoice hub related line items and payment attempts are pull queues (not warehouse tables)",
    "Line-item composition desk uses a pull queue into invoice hubs (not a decorative grid)",
    "Payment attempt list triple-opens attempt hub, Invoice hub, and Tenant hub; line list triple-opens line+Invoice+Tenant",
    "Supplier bank list triple-opens bank hub, Supplier hub, and Tenant hub",
    "Invoice list triple-opens Invoice hub, Supplier vendor context, and submitter User hub",
    "Would run a two-week pilot as-is or with minor fixes",
]

stop_when = """
Stop when you can score adoption_criteria. Call submit_verdict with
recommend=yes|no|conditional and criteria_scores.
"""


[[scenario]]
name = "finance_pay_desk"
login_persona = "finance"
time_budget_seconds = 500
max_steps = 35
starting_url = "/app/workspaces/pay_desk"

user_identity = """
You are the finance operator responsible for settling approved supplier
invoices. You need to identify overdue work and decide which payment or
dispute action applies without losing the invoice context.
"""

business_context = """
Several invoices are ready, overdue, or disputed. Amount and currency must
agree between the queue and the invoice detail. The first screen should lead
you to settlement work rather than unrelated document creation.
"""

tasks = [
    "On Pay Desk, find an overdue invoice and understand the queue's amount and status.",
    "Open it. Does the detail show the same amount and currency and expose the payment or dispute decision?",
    "Can you return to the desk and locate ready and disputed work without using an entity warehouse?",
]

adoption_criteria = [
    "Overdue work is visible and reachable from the first screen",
    "Queue and detail agree on amount and currency",
    "Payment and dispute actions are discoverable in the invoice context",
    "The desk's strongest action matches settlement work",
]

stop_when = """
Stop after opening an overdue invoice, checking the settlement decision, and
scoring the four adoption criteria. Report any incorrect amount or blocked
action as a task failure even if the screen looks polished.
"""
