# Main hygiene: staleness and unpatched advisories, independent of any PR.
#
# Why this exists (#1721)
# ----------------------
# `main` sat frozen for 13 days and nobody noticed. During that window a
# critical anyio CVE (CVE-2026-63374) went unpatched, and *every* open PR went
# red on `security-tests` simultaneously — because each branched off a base that
# failed the security gate for a reason no in-flight PR could fix. The stall cost
# more than the advisory did.
#
# Three separate CVEs landed during one working session (anyio, PyJWT, urllib3),
# and each had the same shape: published out-of-band, discovered only when
# someone opened a PR. `pip-audit` runs inside the PR matrix, so an advisory
# published on a Tuesday sits invisible until Thursday.
#
# This runs on a schedule, against `main`, with no PR required. It reports
# rather than fails: a red scheduled workflow notifies nobody, so the signal has
# to be an issue.
#
# Both checks are idempotent — an existing open issue is edited rather than a
# new one opened per run, so a persistent condition is one tracked thread.

name: Main hygiene

on:
  schedule:
    # Mondays 07:17 UTC. Off the hour deliberately — the other workflows here all
    # fire on :00 and they share GitHub's scheduled-run queue.
    - cron: "17 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

env:
  HYGIENE_LABEL: "automated"

jobs:
  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      # The same composite CI uses. This is not incidental: the first version of
      # this workflow installed uv directly, and `uv pip install pip-audit`
      # failed with "No virtual environment found" because no venv existed. The
      # bare `pip-audit` then resolved to nothing, the step exited non-zero, and
      # the workflow reported **unpatched advisories that did not exist** — a
      # monitoring tool that cries wolf gets ignored, which is worse than not
      # having it. The composite runs `uv sync` and puts `.venv/bin` on PATH.
      # Extras must match the `security-tests` job's exactly
      # (`dev,mobile,postgres,perf`). These two jobs exist to agree about what is
      # clean; auditing a *narrower* tree here means a CVE in a `mobile`/
      # `postgres`-only dependency reports clean here while turning every open PR
      # red in `security-tests`. Drift this list and the monitor starts lying.
      - uses: ./.github/actions/setup-dazzle
        with:
          extras: dev,mobile,postgres,perf
          optional-pip: ""

      # Same as the `security-tests` job. A separate step so its failure is
      # attributable: with this folded into the audit script, a missing tool
      # surfaced as "unpatched advisories".
      - name: Install pip-audit
        run: uv pip install pip-audit

      # --- 1. Is main going stale? -----------------------------------------
      # The signal that was missing. `scripts/push_gate.py` enforces a *minimum*
      # gap between pushes but there is no maximum, so an idle repo looks
      # identical to a healthy one.
      - name: Check whether main has gone stale
        id: stale
        env:
          STALE_DAYS: "7"
        run: |
          latest=$(git log -1 --format=%ct origin/main)
          now=$(date +%s)
          age_days=$(( (now - latest) / 86400 ))
          echo "age_days=$age_days" >> "$GITHUB_OUTPUT"
          echo "latest=$(git log -1 --format='%h %ad' --date=short origin/main)" >> "$GITHUB_OUTPUT"
          if [ "$age_days" -ge "$STALE_DAYS" ]; then
            echo "stale=true" >> "$GITHUB_OUTPUT"
            echo "::warning::main has had no commit for ${age_days} days (threshold ${STALE_DAYS})"
          else
            echo "stale=false" >> "$GITHUB_OUTPUT"
            echo "main is ${age_days} days old — within threshold"
          fi

      # --- 2. Are there advisories against main right now? -----------------
      # Same invocation and same single suppression as the `security-tests`
      # job, so the two cannot disagree about what is clean.
      #
      # A *broken* audit must fail this step, not be reported as a finding.
      # `set -e` plus the explicit command check is what stops the false
      # positive the first version produced.
      - name: Audit main's locked dependencies
        id: audit
        run: |
          set -euo pipefail
          command -v pip-audit >/dev/null || {
            echo "::error::pip-audit is not on PATH — the venv setup failed, so this run cannot say anything about advisories"
            exit 1
          }
          uv pip freeze --exclude-editable > /tmp/audit-reqs.txt
          # pip-audit queries live PyPI per package, so a transient
          # ReadTimeout/handshake failure must not be read as "advisories
          # found" — nor red this job for a clean tree. Same classifier and
          # retry count as the `security-tests` job (ci.yml).
          net_flake='ReadTimeout|timed out|TimeoutError|ConnectionError|Connection reset|Temporary failure|NameResolutionError|SSLError|RemoteDisconnected|Max retries exceeded'
          set +e
          for attempt in 1 2 3; do
            if [ "$attempt" -gt 1 ]; then
              echo "=== pip-audit attempt $attempt / 3 ==="
            fi
            pip-audit --strict --desc --no-deps --disable-pip \
              --ignore-vuln MAL-2026-4750 \
              -r /tmp/audit-reqs.txt 2>&1 | tee /tmp/audit.log
            rc=${PIPESTATUS[0]}
            if [ "$rc" -eq 0 ] \
               || ! grep -qiE "$net_flake" /tmp/audit.log; then
              break            # clean, or a real failure we must not retry
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "pip-audit network flake (rc=$rc); retrying in $((attempt * 15))s"
              sleep "$((attempt * 15))"
            else
              echo "::error::pip-audit exhausted network retries — this run has no advisory verdict (rc=$rc)"
            fi
          done
          set -e
          # Strip ANSI before matching; pip-audit colourises when it thinks it
          # is on a TTY, and an escape prefix defeats a `^`-anchored pattern.
          sed -e 's/\x1b\[[0-9;]*m//g' /tmp/audit.log > /tmp/audit.clean
          # Column-extract rather than regex the whole line: with `--desc` a
          # line is `name version ID fixVersions description…`, and the
          # description carries its own CVE mentions, so a whole-line pattern
          # both misses rows and drags prose into the issue body.
          #
          # The ID vocabulary MUST include PYSEC. Against the PyPI service
          # (this repo's configuration) pip-audit reports overwhelmingly
          # `PYSEC-YYYY-N`, not `GHSA-`/`CVE-`: measured on a real scan,
          # 123 of 124 advisory rows were PYSEC. A `(CVE|GHSA)`-only pattern
          # matches 1 of 124 — so a genuine CVE would have produced an empty
          # finding set and been discarded by the phantom guard below. The
          # monitor would have gone quiet precisely when it was needed.
          awk '$2 ~ /^[0-9]/ && $3 ~ /^(CVE|GHSA|PYSEC|MAL)-[0-9]+(-[0-9]+)?$/ {print $1, $2, $3}' \
            /tmp/audit.clean | sort -u > /tmp/findings.txt
          if [ "$rc" -eq 0 ]; then
            echo "clean=true" >> "$GITHUB_OUTPUT"
          else
            echo "clean=false" >> "$GITHUB_OUTPUT"
            if [ ! -s /tmp/findings.txt ]; then
              # Non-zero with nothing extractable is a tool/transport failure, not
              # an advisory. Do not file a finding on it.
              echo "::error::pip-audit exited ${rc} but no advisory rows were parsed — refusing to report a phantom finding"
              exit 1
            fi
          fi

      # --- 3. Report, idempotently -----------------------------------------
      - name: Open or update a hygiene issue
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9
        env:
          STALE: ${{ steps.stale.outputs.stale }}
          AGE_DAYS: ${{ steps.stale.outputs.age_days }}
          LATEST: ${{ steps.stale.outputs.latest }}
          CLEAN: ${{ steps.audit.outputs.clean }}
          SERVER_URL: ${{ github.server_url }}
        with:
          script: |
            const fs = require('fs');
            const stale = process.env.STALE === 'true';
            const clean = process.env.CLEAN === 'true';
            if (!stale && clean) {
              core.info('main is fresh and its dependencies are clean — nothing to report.');
              return;
            }

            const problems = [];
            if (!clean) {
              const findings = fs.readFileSync('/tmp/findings.txt', 'utf8').trim();
              problems.push(
                '### Unpatched advisories against `main`\n\n' +
                '`pip-audit --strict` on the locked tree, same invocation as the ' +
                '`security-tests` job. Each of these turns **all** open PRs red ' +
                'simultaneously, because every one branches off a base that fails the gate.\n\n' +
                '```\n' + (findings || '(see run log)') + '\n```\n\n' +
                'Bump the offending package and land that first — it unblocks the PR queue.'
              );
            }
            if (stale) {
              problems.push(
                '### `main` has gone stale\n\n' +
                `Newest commit on main: \`${process.env.LATEST}\` — **${process.env.AGE_DAYS} days ago**. ` +
                'There is a minimum gap between pushes but no maximum, so an idle ' +
                'main looks identical to a healthy one. Check whether an agent loop ' +
                'or a blocked release is holding it.'
              );
            }

            const body = [
              '<!-- main-hygiene -->',
              'Automated weekly check of `main`. Updated in place — one issue tracks',
              'the condition, not each run.',
              '',
              ...problems,
              '',
              '<sub>Run: ' + context.payload.repository.full_name + ' @ ' +
              context.runId + ' (' + process.env.SERVER_URL + '/' +
              context.repo.owner.repo + '/actions/runs/' + context.runId + ')</sub>',
            ].join('\n');

            const title = !clean
              ? 'main: unpatched advisories in the locked dependency tree'
              : 'main: no new commits for over a week';

            const marker = '<!-- main-hygiene -->';
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: process.env.HYGIENE_LABEL,
              per_page: 100,
            });
            const prior = existing.data.find(i => (i.body || '').includes(marker));

            if (prior) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prior.number,
                body,
              });
              core.info('Updated existing hygiene issue #' + prior.number);
            } else {
              const created = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: [process.env.HYGIENE_LABEL],
              });
              core.info('Opened hygiene issue #' + created.data.number);
            }
