name: Update Vendor Dependencies

on:
  schedule:
    - cron: '0 9 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update-vendors:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'
      - name: Check for vendor updates
        run: python scripts/update_vendors.py --check
      - name: Update vendors
        # Tee stdout so the next step can sed out the VENDOR_HASH_DIFF
        # block the script emits between sentinels for PR body capture.
        run: python scripts/update_vendors.py | tee /tmp/update-vendors.log
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Check for vendor changes
        # Gate BEFORE the dist rebuild: build_dist.py stamps the current
        # project version into the dist banners, so an unconditional rebuild
        # produces a spurious banner-only PR whenever version bumps have
        # landed without a JS change (see #1510).
        id: vendor_diff
        run: |
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No vendor changes detected"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Rebuild dist bundles
        if: steps.vendor_diff.outputs.changed == 'true'
        run: python scripts/build_dist.py
      - name: Assert vendor bot App is configured
        # The PR author must equal the commit author, or branch protection's
        # `require_extra_approval_for_unattributed_changes` can never be
        # satisfied and the PR is stuck forever. `GITHUB_TOKEN` makes the PR
        # author `app/github-actions` while the commit is authored by
        # `github-actions[bot]` -- two different identities, so no approval can
        # be granted. That blocked every vendor PR from 2026-09-21 until
        # 2026-09-29 and recurs weekly (#1721).
        #
        # Fail loudly rather than falling back to GITHUB_TOKEN: a silent
        # fallback recreates exactly the stuck-PR condition this guards.
        if: steps.vendor_diff.outputs.changed == 'true'
        env:
          APP_ID: ${{ vars.VENDOR_BOT_APP_ID }}
          APP_KEY: ${{ secrets.VENDOR_BOT_PRIVATE_KEY }}
          ACTOR_NAME: ${{ vars.VENDOR_ACTOR_NAME }}
          ACTOR_EMAIL: ${{ vars.VENDOR_ACTOR_EMAIL }}
        run: |
          missing=""
          [ -z "$APP_ID" ]    && missing="${missing}vars.VENDOR_BOT_APP_ID "
          [ -z "$APP_KEY" ]   && missing="${missing}secrets.VENDOR_BOT_PRIVATE_KEY "
          [ -z "$ACTOR_NAME" ]  && missing="${missing}vars.VENDOR_ACTOR_NAME "
          [ -z "$ACTOR_EMAIL" ] && missing="${missing}vars.VENDOR_ACTOR_EMAIL "
          if [ -n "$missing" ]; then
            echo "::error::vendor bot App is not configured -- missing: ${missing}"
            echo ""
            echo "The vendor update needs a maintainer-owned identity so the commit"
            echo "author and the PR author are the SAME identity. See"
            echo "docs/contributing/vendor-bot-token.md for the one-time setup."
            echo ""
            echo "Failing here rather than falling back to GITHUB_TOKEN: the"
            echo "fallback recreates the stuck-PR condition this guards against."
            exit 1
          fi
      - name: Mint installation token
        # An App installation token expires in ~1 hour, so it cannot be stored
        # as a long-lived secret. It is minted here, per run, from the App's
        # private key. That is why the App (not a PAT) is the recommended shape.
        id: vendor_token
        if: steps.vendor_diff.outputs.changed == 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3.2.0
        with:
          app-id: ${{ vars.VENDOR_BOT_APP_ID }}
          private-key: ${{ secrets.VENDOR_BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
      - name: Create PR
        if: steps.vendor_diff.outputs.changed == 'true'
        env:
          # Minted per run -- NOT GITHUB_TOKEN. See the steps above.
          GH_TOKEN: ${{ steps.vendor_token.outputs.token }}
          VENDOR_ACTOR_NAME: ${{ vars.VENDOR_ACTOR_NAME }}
          VENDOR_ACTOR_EMAIL: ${{ vars.VENDOR_ACTOR_EMAIL }}
        run: |
          BRANCH="update-vendors"
          # Declared identity — asserted present by the previous step.
          # This is what makes author == committer == PR author, which is the
          # only way the required extra approval can be granted.
          git config user.name "$VENDOR_ACTOR_NAME"
          git config user.email "$VENDOR_ACTOR_EMAIL"
          git checkout -B "$BRANCH"
          git add -A
          git commit -m "Update vendor JS dependencies"
          git push -u origin "$BRANCH" --force

          # Extract the structured hash diff between the sentinels
          # update_vendors.py prints. Falls back gracefully if absent.
          HASH_DIFF=$(sed -n '/=== VENDOR_HASH_DIFF ===/,/=== \/VENDOR_HASH_DIFF ===/p' /tmp/update-vendors.log | sed -e '1d' -e '$d')
          if [ -z "$HASH_DIFF" ]; then
            HASH_DIFF="_No hash diff captured; update_vendors.py output may have changed format._"
          fi

          # Single-quoted heredoc means no $-interpolation and no backtick
          # command substitution — safe to embed code references literally.
          # We assemble the body by replacing a __HASH_DIFF__ placeholder
          # after the heredoc runs.
          PR_BODY_TEMPLATE=$(cat <<'BODY'
          Automated vendor dependency update.

          __HASH_DIFF__

          ## Reviewer checklist

          1. **Verify each new SHA-256** in the table above against the
             published npm/CDN file (same path the script downloaded).
             `vendor/` is byte-exact ingest; `sourceMappingURL` is
             stripped later in `scripts/build_dist.py` because browsers
             load `dist/`, not `vendor/`.
          2. Run `python scripts/build_dist.py` locally and smoke-test
             at least one example app.
          3. The CI drift gate `tests/unit/test_vendor_hash_drift.py` accepts
             this state because the manifest was rewritten in the same
             commit. If you re-roll the vendored files outside this
             workflow, run `python scripts/update_vendor_hashes.py`.
          BODY
          )
          PR_BODY=${PR_BODY_TEMPLATE//__HASH_DIFF__/$HASH_DIFF}

          EXISTING=$(gh pr list --head "$BRANCH" --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            gh pr edit "$EXISTING" --body "$PR_BODY"
            echo "Updated PR #$EXISTING body"
          else
            gh pr create \
              --title "Update vendor JS dependencies" \
              --body "$PR_BODY" \
              --head "$BRANCH"
          fi
