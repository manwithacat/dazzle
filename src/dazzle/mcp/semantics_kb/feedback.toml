# Feedback Widget — knowledge for the human→agent feedback loop.

[concepts.feedback_widget]
category = "Framework Feature"
since_version = "0.48.0"
changed_in = [
  { version = "0.126.0", note = "#1854: review posture (review: block), categories/severities applied to the entity, anchor/context columns, server-stamped identity, idempotent replay, caps, rate limit, list filters" },
  { version = "0.48.15", note = "Resolved-report notification toast on page load" },
  { version = "0.48.13", note = "Mobile Safari fixes: button type, focus removal, dvh viewport" },
  { version = "0.48.12", note = "Retry toast suppressed on background retries" },
]
definition = """
In-app feedback collection. When `feedback_widget: enabled` is declared in the DSL,
the framework auto-generates a FeedbackReport entity, three synthetic surfaces
(CREATE, LIST, EDIT), and corresponding CRUD routes. A floating button appears on
every authenticated page, letting users report bugs, UX issues, and suggestions.
"""
syntax = """
feedback_widget: enabled
  position: bottom-right
  shortcut: backtick                    # none | key | ctrl-shift-f
  categories: [bug, ux, copy, data, question, idea]   # becomes the category enum
  severities: [p1, p2, p3, note]                       # becomes the severity enum; first = default
  capture: [url, persona, viewport, user_agent, console_errors, nav_history, page_snapshot]
  review:                               # #1854 — optional review posture
    personas: [super_admin, trust_admin]   # required when review: is present; declared personas only
    shortcut: alt-shift-r                  # default alt+shift+r; none turns it off
    screenshot: off                        # off | optional
"""

[concepts.feedback_review]
category = "Framework Feature"
since_version = "0.126.0"
definition = """
The review posture of the feedback widget (#1854). Personas listed under
`feedback_widget: review: personas:` get an anchor mode (the review chord, default
alt+shift+r, or "Point at it" in the panel): they point at an element, leave a note,
and the note is stored as a FeedbackReport whose `anchor` (json) names the element
(dz_anchor path, unique CSS selector, text quote, rect) and whose `context` (json)
holds the page context (surface, entity, record, workspace, persona, viewport,
htmx_history, console_errors). `surface` and `review_session` (one per tab,
YYYY-MM-DD-xxxx) are stored as their own columns so they filter. Reviewers also
see the page's open notes as numbered pins and can resolve them.

The page tells the client its policy through meta tags (dz-feedback-categories,
dz-feedback-severities, dz-feedback-screenshot, dz-feedback-review-shortcut,
dz-feedback-review-personas) and the reviewer flag per request (dz-feedback-review=1);
<body> carries data-dz-surface / -entity / -record / -workspace / -persona.

Server contract for POST /feedbackreports: reported_by and persona are stamped
from the session (payload ignored); description <= 4000 chars, anchor+context+
page_snapshot+console_errors <= 32 KB, screenshot_data <= 1.5 MB (422 otherwise);
Idempotency-Key replay answers 200 + Idempotent-Replayed: true with the stored row,
also on a unique-violation race; a different payload under the same key is 422;
30/min and 300/day per user (429 + Retry-After). GET /feedbackreports accepts
status (comma list), since (ISO 8601, created_at >=), page_url, surface and
review_session.
"""

[concepts.feedback_report]
category = "Auto-Generated Entity"
definition = """
The FeedbackReport entity is auto-generated by the linker when `feedback_widget: enabled`.
It stores user-submitted feedback with category, severity, description, auto-captured context
(page URL, viewport, console errors, navigation history), the review anchor and page context
(`anchor`, `context` json; `surface`; `review_session`, #1854) and agent triage fields. The
category / severity enums come from the DSL's `categories:` / `severities:`.

State machine: new -> triaged -> in_progress -> resolved -> verified (also: wont_fix, duplicate).
Shortcut: triaged -> resolved (for quick fixes).
"""

[concepts.feedback_loop]
category = "Workflow Pattern"
definition = """
The human-to-agent feedback loop:
1. User submits feedback via the widget (POST /feedbackreports)
2. Agent reads feedback via MCP tool: feedback(operation='list')
3. Agent reads detail: feedback(operation='get', id='...')
4. Agent fixes the issue (edits code, updates DSL, etc.)
5. Agent resolves: feedback(operation='resolve', id='...', agent_notes='Fixed in commit ...')
"""

[workflows.feedback_triage]
name = "Feedback Triage Workflow"
steps = [
    "feedback(operation='list', status='new') — see unprocessed feedback",
    "feedback(operation='get', id='<id>') — read full report with context",
    "Fix the reported issue (edit code, DSL, CSS, etc.)",
    "feedback(operation='resolve', id='<id>', agent_notes='Fixed in commit <sha>') — close the loop",
]
