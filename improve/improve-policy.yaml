# Configurable /improve prioritisation — steady-state vs campaign override.
#
# Read by scripts/improve_policy.py (and human operators at Step 1).
# Campaign override beats residual-only explore when active; hard preemption
# still applies (REGRESSION, red CI, CodeQL high, GitHub inbox claim).
#
# Toggle campaign:
#   python scripts/improve_policy.py --activate land-l25-smoke
#   python scripts/improve_policy.py --activate aggressive-change
#   python scripts/improve_policy.py --clear-campaign
#   python scripts/improve_policy.py --status

version: 1

# Active campaign id, or null / omitted for pure steady_state.
# Operator 2026-07-27: aggressive-change — ship product/framework mutations, not clean re-stamps.
active_campaign: aggressive-change

steady_state:
  # After hard preemption (CI / CodeQL / REGRESSION / inbox), prefer in order:
  selection_order:
    - regression
    - self_audit_cadence
    - capability_sweep_cadence
    - signal_bias
    - probe_residual          # product/demo/journey/story/acceptance + qa_smoke
    - tr_signal_drain
    - campaign_or_recurring   # see campaigns + recurring
    - explore_cognition
    - explore_hygiene
    - explore_ordinary        # densify only if densify_allowed=1

  recurring:
    # Mechanical L2.5 smoke dig — not residual-gated. Kept sparse so deep digs
    # and acceptance panels are not starved by map-stamp thrash.
    - id: agent_qa_smoke
      every_n_cycles: 8
      lane: example-apps
      strategy: agent_qa_smoke
      force_args: "example-apps agent_qa_smoke"
      note: "L2.5 smoke-dig fleet rotation (404 / empty main / structure)"

  densify:
    # #1637 hard floor still applies when densify_allowed=0 (wi_fleet ≤ 0.25).
    # Aggressive campaigns do NOT bypass WI clone-desk ban — they dig deeper
    # elsewhere (acceptance, dual-lock, story_walk, framework-ux).
    hard_stop_when_floor: true

campaigns:
  land-l25-smoke:
    title: "Land L2.5 smoke digs on showcase examples"
    success_criteria:
      - "Gross bugs found or cleared: HTTP 404/5xx, empty main, white screens"
      - "At least one full showcase rotation via smoke-dig"
      - "qa_smoke residual drives improve when auto_seed non-empty"
    prefer:
      lane: example-apps
      strategy: agent_qa_smoke
      force_args: "example-apps agent_qa_smoke"
    yield_to:
      - regression
      - ci_repair
      - codeql
      - github_inbox
      - self_audit_cadence
    preempt_probe_residual: false
    boost_probe: qa_smoke
    max_cycles: 40
    notes: >
      Near-term priority: dig exercising examples. Success = finding gross
      bugs (404s). Subtler bugs welcome. Do not densify.

  # Operator posture: ship real mutations (2026-07-27, re-tightened after stamp thrash).
  # Aggression = product/framework code ships + fix-in-cycle when dig finds friction.
  # NOT: clean dual-lock deferrals, map stamps, or endless harness-only re-panels.
  aggressive-change:
    title: "Aggressive digs — ship product/framework mutations"
    posture: aggressive
    # Dig cycles should leave a code or PENDING-seed trail, not map-only PASS.
    require_mutation: true
    # After this many consecutive acceptance panels without a product/framework
    # ship, rotate hard to framework-ux / hyperpart (breaks harness re-panel thrash).
    max_consecutive_panels: 2
    success_criteria:
      - "Most dig cycles ship product or framework code (or seed actionable PENDING)"
      - "Friction found in digs is fixed in-cycle or next cycle — not re-logged forever"
      - "Drained queues (dual_lock depth 0) are skipped, not re-stamped as PASS"
      - "No isomorphic *_ops densify while densify_allowed=0 (#1637)"
    prefer:
      lane: framework-ux
      strategy: explore
      force_args: "framework-ux"
    prefer_rotation:
      # Mutation-first order (picker still LRU among eligible entries).
      - force_args: "framework-ux"
        lane: framework-ux
        strategy: framework-ux
        note: "Ship UX/fragment/runtime improvements; fix harness-class friction at root"
      - force_args: "hm-convergence hyperpart_coherence"
        lane: hm-convergence
        strategy: hyperpart_coherence
        note: "Investigate or drain Hyperpart visual defects — fix ships"
      - force_args: "example-apps story_walk"
        lane: example-apps
        strategy: story_walk
        note: "Live walk contracts; failing walks → ship product/story fixes"
      - force_args: "example-apps agent_acceptance_panel"
        lane: example-apps
        strategy: agent_acceptance_panel
        note: "Live trial; same-cycle fix or PENDING seed when friction is product/framework"
        is_panel: true
      - force_args: "example-apps journey_dogfood"
        lane: example-apps
        strategy: journey_dogfood
        note: "Journey maturity residual — ship journey/story gaps"
      - force_args: "hm-convergence gallery_probes"
        lane: hm-convergence
        strategy: gallery_probes
        note: "Gallery probe residual / visual truth — fix emitters when red"
      - force_args: "hm-convergence dual_lock_expand"
        lane: hm-convergence
        strategy: dual_lock_expand
        note: "Promote dual-lock queue heads only"
        require_dual_lock_queue: true
      - force_args: "example-apps agent_qa_smoke"
        lane: example-apps
        strategy: agent_qa_smoke
        note: "Deep smoke only when structure/fail>0 or auto_seed — else skip stamp"
        require_smoke_residual: true
    yield_to:
      - regression
      - ci_repair
      - codeql
      - github_inbox
    suppress_recurring_smoke: true
    boost_probe: null
    max_cycles: 80
    notes: >
      Operator: more aggressive change. Prefer framework-ux and hyperpart ships
      over clean dual-lock deferrals and harness-only re-panels. When a dig finds
      product or framework friction, fix it in the same cycle (or seed PENDING and
      claim next). densify_allowed=0 remains hard stop for warehouse desk clones —
      aggression is depth and real ships, not sprawl. Skip dual_lock when queue
      depth is 0; skip smoke when residual is 0.
